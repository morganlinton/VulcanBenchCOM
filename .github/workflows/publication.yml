name: Publication checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pypdf==6.1.1
      - run: python scripts/verify_swe_v4_evidence.py
      - run: python scripts/derive_swe_v4_sensitivity.py --check
      - run: python scripts/check_benchmark_index.py
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/verify_swe_v4_pdf.py
      - name: Check new writing
        env:
          WRITING_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_writing.py --base "$WRITING_BASE"
